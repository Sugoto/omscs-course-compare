<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMSCS Course Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: light; }
img { max-width: 100%; }
body { margin: 0; }
/* Layout: header + course toggles, then one comparison grid — feature labels on the left, one column per course */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #1b2030;
  --muted: #5d6478;
  --line: #dfe2ea;
  --accent: #8a7535;      /* GT old gold, darkened for contrast */
  --accent-soft: #f1ead6;
  --good: #1f7a4d; --good-bg: #e3f3ea;
  --warn: #9a6200; --warn-bg: #fbefd9;
  --bad: #b3372f;  --bad-bg: #fbe4e2;
  --neutral-bg: #eceef3;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151d; --surface: #1a1e29; --fg: #e6e8ef; --muted: #9aa1b4; --line: #2b3040;
    --accent: #d2bc7a; --accent-soft: #2e2a1c;
    --good: #6fd09d; --good-bg: #173326; --warn: #e8b55a; --warn-bg: #352812;
    --bad: #f08a80; --bad-bg: #3a1c1a; --neutral-bg: #252a37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151d; --surface: #1a1e29; --fg: #e6e8ef; --muted: #9aa1b4; --line: #2b3040;
  --accent: #d2bc7a; --accent-soft: #2e2a1c;
  --good: #6fd09d; --good-bg: #173326; --warn: #e8b55a; --warn-bg: #352812;
  --bad: #f08a80; --bad-bg: #3a1c1a; --neutral-bg: #252a37;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 16px 0 0; letter-spacing: -0.01em; }
.block { display: flex; flex-direction: column; gap: 16px; }
#required .scroller { max-width: 900px; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
.picker {
  margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 4px; }
.toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; }
.check { display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding: 4px 0; min-width: 0; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; align-self: center; cursor: pointer; }
.check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.c-code { font: 500 13px var(--font-mono); color: var(--fg); flex: none; }
.c-name { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check.all { padding-bottom: 8px; border-bottom: 1px solid var(--line); }

.scroller { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.grid { display: grid; min-width: min-content; }
.cell { padding: 14px 16px; border-top: 1px solid var(--line); min-width: 0; }
.cell + .cell { border-left: 1px solid var(--line); }
.rowlabel {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); position: sticky; left: 0; background: var(--surface); z-index: 1;
}
.head { border-top: none; display: flex; flex-direction: column; gap: 4px; }
.head .code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 500; }
.head a.name { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--fg); text-decoration: none; line-height: 1.25; text-wrap: balance; }
.head a.name:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.head .meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.section {
  grid-column: 1 / -1; padding: 10px 16px; border-top: 1px solid var(--line);
  font-family: var(--font-display); font-weight: 500; font-size: 13px; background: var(--neutral-bg); color: var(--fg);
}

.meter { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { flex: 1; max-width: 120px; height: 6px; border-radius: 3px; background: var(--neutral-bg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.why { font-size: 13px; color: var(--muted); margin-top: 6px; }

.pill { display: inline-block; font: 500 12px var(--font-mono); padding: 3px 9px; border-radius: 999px; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad  { color: var(--bad);  background: var(--bad-bg); }

ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
li::marker { color: var(--accent); }
.downs li::marker { color: var(--bad); }
.verdict { font-weight: 600; }
.empty { padding: 32px; color: var(--muted); text-align: center; }
footer { font-size: 12px; color: var(--muted); max-width: 80ch; }
</style>
</head>

<div class="wrap">
  <header>
    <h1>OMSCS Course Compare</h1>
  </header>

  <section class="block" id="core">
    <fieldset class="picker">
      <legend class="lbl">Courses to compare</legend>

    </fieldset>
    <div class="scroller"><div class="grid"></div></div>
  </section>

</div>

function meter(v) {
  return `<div class="meter"><span>${v.toFixed(1)}</span><span class="bar"><i style="width:${v / 5 * 100}%"></i></span></div>`;
}
function pill(p) { return `<span class="pill ${p.tone}">${p.label}</span>` + (p.note ? `<div class="why">${p.note}</div>` : ""); }
function list(items, cls = "") { return `<ul class="${cls}">${items.map(i => `<li>${i}</li>`).join("")}</ul>`; }

// One picker + grid per section, each with its own selection. A section without a picker shows every course.
function setup(root, courses, rows) {
  const visible = new Set(courses.map(c => c.id));
  const box = root.querySelector(".toggles");
  const all = root.querySelector(".check.all input");
  const grid = root.querySelector(".grid");
  const inputs = {};
  if (!box) { renderGrid(); return; }

  function renderGrid() {
    const shown = courses.filter(c => visible.has(c.id));
    if (!shown.length) { grid.style.gridTemplateColumns = "1fr"; grid.innerHTML = `<div class="empty">Pick a course above to see its breakdown.</div>`; return; }
    grid.style.gridTemplateColumns = `140px repeat(${shown.length}, minmax(260px, 1fr))`;
    let html = `<div class="cell rowlabel head"></div>` + shown.map(c =>
      `<div class="cell head"><span class="code">${c.code}</span><a class="name" href="${c.url}" target="_blank" rel="noopener">${c.name}</a></div>`
    ).join("");
    rows.forEach(r => {
      if (r.section) { html += `<div class="section">${r.section}</div>`; return; }
      html += `<div class="cell rowlabel">${r.label}</div>` + shown.map(c => `<div class="cell">${r.render(c)}</div>`).join("");
    });
    grid.innerHTML = html;
  }

  const syncAll = () => {
    all.checked = visible.size === courses.length;
    all.indeterminate = visible.size > 0 && visible.size < courses.length;
  };
  courses.forEach(c => {
    const l = document.createElement("label");
    l.className = "check";
    l.innerHTML = `<input type="checkbox" checked><span class="c-code">${c.code}</span><span class="c-name">${c.name}</span>`;
    inputs[c.id] = l.querySelector("input");
    inputs[c.id].addEventListener("change", e => {
      e.target.checked ? visible.add(c.id) : visible.delete(c.id);
      syncAll(); renderGrid();
    });
    box.appendChild(l);
  });
  all.addEventListener("change", () => {
    courses.forEach(c => {
      inputs[c.id].checked = all.checked;
      all.checked ? visible.add(c.id) : visible.delete(c.id);
    });
    syncAll(); renderGrid();
  });
  syncAll();
  renderGrid();
}

setup(document.getElementById("core"), COURSES, ROWS);
setup(document.getElementById("required"), REQUIRED, REQ_ROWS);
setup(document.getElementById("pairing"), PAIRING, PAIR_ROWS);
